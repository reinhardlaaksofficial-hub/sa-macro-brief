name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The offline suite only. Live tests are opt-in via SA_BRIEF_LIVE_TESTS
    # and are deliberately never run here: CI must not repeatedly fetch from
    # Statistics South Africa's servers.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::pdftools
            any::rvest
            any::httr2
            any::dplyr
            any::tidyr
            any::stringr
            any::lubridate
            any::ggplot2
            any::yaml
            any::here
            any::testthat
            any::withr
            any::zip
            any::ragg

      - name: Run offline test suite
        run: Rscript -e 'q(status = as.integer(any(as.data.frame(testthat::test_dir("tests", stop_on_failure = FALSE))$failed > 0)))'
