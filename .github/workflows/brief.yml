name: Build a briefing

# Zero-install trial: on the repo's Actions tab, choose "Build a briefing",
# pick a release and period, and download the finished PDF as an artifact.
# No R, Quarto or TeX on your machine.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release'
        required: true
        default: 'cpi'
        type: choice
        options: [cpi, ppi, gdp, qlfs]
      period:
        description: 'Reference period (YYYY-MM for cpi/ppi, YYYYQn for gdp/qlfs)'
        required: true
        default: '2026-07'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::pdftools
            any::rvest
            any::httr2
            any::dplyr
            any::tidyr
            any::stringr
            any::lubridate
            any::ggplot2
            any::yaml
            any::here
            any::optparse
            any::quarto
            any::zip
            any::ragg
            any::testthat
            any::withr

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Build the briefing
        run: ./sa-brief "${{ inputs.release }}" --period "${{ inputs.period }}"

      - name: Upload the PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release }}-${{ inputs.period }}-briefing
          path: |
            output/*.pdf
            output/charts/*.png
          if-no-files-found: error
          retention-days: 30
